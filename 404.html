<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificando Certificado | RNCE</title>
    <style>
        body {
            background-color: #003B5C;
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #E86125;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        p { font-size: 18px; letter-spacing: 0.5px; opacity: 0.9; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p>Verificando certificado...</p>

    <script>
        // Función para extraer el ID del certificado de la URL
        function getCertificateIdFromPath() {
            const path = window.location.pathname;
            console.log('Path actual:', path);
            
            // Buscar patrones como /verificar/XXXXX
            const verificarMatch = path.match(/\/verificar\/([^\/]+)/);
            if (verificarMatch && verificarMatch[1]) {
                return decodeURIComponent(verificarMatch[1]);
            }
            
            // Buscar patrones como /certificado/XXXXX
            const certificadoMatch = path.match(/\/certificado\/([^\/]+)/);
            if (certificadoMatch && certificadoMatch[1]) {
                return decodeURIComponent(certificadoMatch[1]);
            }
            
            // Buscar patrones como /validar/XXXXX
            const validarMatch = path.match(/\/validar\/([^\/]+)/);
            if (validarMatch && validarMatch[1]) {
                return decodeURIComponent(validarMatch[1]);
            }
            
            // Si no hay match en el path, intentar con query params
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (id) {
                return id;
            }
            
            return null;
        }
        
        const certificateId = getCertificateIdFromPath();
        
        if (certificateId) {
            console.log('✅ ID encontrado, redirigiendo:', certificateId);
            // Guardar el ID en sessionStorage para usarlo en index.html
            sessionStorage.setItem('certificateId', certificateId);
            
            // Redirigir a index.html
            window.location.replace('/index.html');
        } else {
            console.log('❌ No se encontró ID, redirigiendo a index.html');
            // Si no hay ID, redirigir a index.html que mostrará el error
            window.location.replace('/index.html');
        }
    </script>
</body>
</html>
