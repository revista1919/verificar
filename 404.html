<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo a Sistema de Verificación | RNCE</title>
    <style>
        body {
            background-color: #003B5C; /* Azul institucional */
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #E86125; /* Naranja institucional */
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        p { font-size: 18px; letter-spacing: 0.5px; opacity: 0.9; }
    </style>
    <script>
        // Redirigir a la página de verificación con el ID
        const path = window.location.pathname;
        if (path.startsWith('/verificar/')) {
            // Mantener la URL y cargar la página de verificación
            window.location.href = '/verificar/index.html' + window.location.search;
        }
    </script>
</head>
<body>
    <div class="spinner"></div>
    <p>Conectando con la base de datos oficial...</p>
</body>
</html>
